<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Matter Map (public dark style)</title>
    <link href="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #0b0f14;
        overflow: hidden;
      }

      * {
        box-sizing: border-box;
      }

      #map {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 320px;
        width: calc(100% - 320px);
        height: 100%;
      }

      /* MapLibre defaults the canvas cursor to a "grab" hand; we want a
         normal pointer at rest (the drawing tools still set their own
         crosshair cursor via JS while active). */
      .maplibregl-canvas-container.maplibregl-interactive,
      .maplibregl-canvas-container.maplibregl-interactive:active {
        cursor: default !important;
      }

      #coordinatePopup {
        position: fixed;
        z-index: 1000;
        min-width: 240px;
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        background: #ffffff;
        color: #111111;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        font-size: 13px;
        opacity: 0;
        transform: translateY(6px) scale(0.98);
        pointer-events: none;
        transition: opacity 0.16s ease, transform 0.16s ease;
      }

      #coordinatePopup.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      #coordinateHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 7px;
      }

      #coordinatePopup strong {
        display: block;
        font-size: 13px;
      }

      #closeCoordinatesBtn {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #111111;
        font: inherit;
        font-size: 19px;
        line-height: 1;
        cursor: pointer;
      }

      #closeCoordinatesBtn:hover {
        background: #eeeeee;
      }

      #coordinateText {
        margin-bottom: 10px;
        font-variant-numeric: tabular-nums;
        line-height: 1.5;
        white-space: pre-line;
      }

      #copyCoordinatesBtn {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid #c8c8c8;
        border-radius: 6px;
        background: #f5f5f5;
        color: #111111;
        font: inherit;
        cursor: pointer;
      }

      #copyCoordinatesBtn:hover {
        background: #e9e9e9;
      }

      #addPinpointBtn {
        width: 100%;
        margin-top: 8px;
        padding: 7px 9px;
        border: 1px solid #c8c8c8;
        border-radius: 6px;
        background: #f5f5f5;
        color: #111111;
        font: inherit;
        cursor: pointer;
      }

      #addPinpointBtn:hover {
        background: #e9e9e9;
      }

      #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 320px;
        z-index: 500;
        background: rgba(10, 10, 10, 0.96);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 18px 0 34px rgba(0, 0, 0, 0.25);
        color: #edf5ff;
        display: flex;
        flex-direction: column;
      }

      #sidebar-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 18px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #98a9b9;
        margin-bottom: 4px;
      }

      #sidebar-header h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.1;
        font-weight: 700;
      }

      #drawToolsBtn {
        min-width: 82px;
        height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        background: rgba(255, 255, 255, 0.04);
        color: #f5f8ff;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      }

      #drawToolsBtn:hover,
      #drawToolsBtn[aria-expanded="true"] {
        background: rgba(255, 255, 255, 0.08);
      }

      #drawToolsBtn span {
        margin-right: 5px;
        font-size: 17px;
      }

      #toolMenu {
        position: absolute;
        top: calc(100% + 8px);
        right: 12px;
        z-index: 2;
        width: 220px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: #111820;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      }

      #toolMenu[hidden] {
        display: none;
      }

      .tool-option {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #edf5ff;
        text-align: left;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .tool-option:hover,
      .tool-option[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.09);
      }

      .tool-symbol {
        width: 22px;
        color: #aebdca;
        text-align: center;
        font-size: 17px;
      }

      .tool-divider {
        height: 1px;
        margin: 6px 2px;
        background: rgba(255, 255, 255, 0.09);
      }

      .clear-drawings {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #ff9b91;
        text-align: left;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .clear-drawings:hover:not(:disabled) {
        background: rgba(255, 115, 102, 0.1);
      }

      .clear-drawings:disabled {
        opacity: 0.42;
        cursor: default;
      }

      .color-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        color: #d7e0e8;
        font-size: 13px;
      }

      #drawColor {
        width: 34px;
        height: 28px;
        padding: 2px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 7px;
        background: transparent;
        cursor: pointer;
      }

      #drawHint {
        min-height: 28px;
        padding: 5px 10px 2px;
        color: #94a5b4;
        font-size: 11px;
        line-height: 1.4;
      }

      #mapSummary {
        padding: 14px 18px 10px;
        color: #ccd6e1;
        font-size: 12px;
        opacity: 0.9;
      }

      #searchBox {
        position: relative;
        display: flex;
        gap: 8px;
        padding: 14px 18px 4px;
      }

      #searchInput {
        flex: 1;
        min-width: 0;
        height: 38px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #151515;
        color: #edf5ff;
        font: inherit;
        font-size: 13px;
      }

      #searchInput::placeholder {
        color: #7c8a97;
      }

      #searchResults {
        position: absolute;
        top: calc(100% + 2px);
        left: 18px;
        right: 18px;
        z-index: 20;
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        background: #111820;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      }

      #searchResults[hidden] {
        display: none;
      }

      .search-result-item {
        display: block;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: transparent;
        color: #edf5ff;
        text-align: left;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .search-result-item:last-child {
        border-bottom: 0;
      }

      .search-result-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .search-result-message {
        padding: 10px 12px;
        color: #94a5b4;
        font-size: 12px;
      }

      .maplibregl-popup-content {
        padding: 14px;
        border-radius: 10px;
        background: #111820;
        color: #edf5ff;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      }

      .maplibregl-popup-tip {
        border-top-color: #111820 !important;
        border-bottom-color: #111820 !important;
      }

      .maplibregl-popup-close-button {
        color: #edf5ff;
        font-size: 18px;
        padding: 4px 8px;
      }

      .maplibregl-popup-close-button:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .marker-popup-title {
        font-size: 15px;
        font-weight: 700;
        margin: 0 18px 2px 0;
      }

      .marker-popup-subtitle {
        font-size: 12px;
        color: #98a9b9;
        margin-bottom: 8px;
      }

      .marker-popup-coords {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        margin-bottom: 10px;
      }

      .marker-popup-copy {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: #edf5ff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .marker-popup-copy:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .marker-popup-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .marker-popup-delete {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid rgba(255, 115, 102, 0.35);
        border-radius: 6px;
        background: rgba(255, 115, 102, 0.1);
        color: #ff9b91;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .marker-popup-delete:hover {
        background: rgba(255, 115, 102, 0.2);
      }

      #layersList {
        flex: 1;
        overflow-y: auto;
        padding: 6px 12px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #stylePicker {
        padding: 14px 18px 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      #stylePicker label {
        display: block;
        margin-bottom: 8px;
        color: #98a9b9;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #mapStyleSelect {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #151515;
        color: #edf5ff;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .layer-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .layer-item.hidden {
        opacity: 0.62;
      }

      .layer-item:hover {
        background: rgba(255, 255, 255, 0.045);
        border-color: rgba(255, 255, 255, 0.11);
      }

      .layer-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.28);
        flex-shrink: 0;
      }

      .layer-name {
        flex: 1;
        font-size: 15px;
        font-weight: 600;
      }

      .layer-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toggle-btn {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: #edf5ff;
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 11px;
        cursor: pointer;
      }

      .toggle-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      @media (max-width: 640px) {
        #sidebar {
          width: 70vw;
        }

        #map {
          left: 70vw;
          width: 30vw;
        }

        #sidebar-header h1 {
          font-size: 22px;
        }
      }

      #error {
        position: absolute;
        left: 12px;
        top: 12px;
        background: rgba(0,0,0,0.6);
        color: #fff;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 13px;
        display: none;
        z-index: 9999;
      }

      #kmlHoverLabel {
        position: fixed;
        z-index: 1500;
        padding: 4px 9px;
        border-radius: 6px;
        background: rgba(17, 24, 32, 0.92);
        color: #edf5ff;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      }

      #kmlHoverLabel[hidden] {
        display: none;
      }

      #accountBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        color: #ccd6e1;
        font-size: 12px;
      }

      #accountBar strong {
        color: #edf5ff;
      }

      #logoutBtn {
        border: 1px solid rgba(255, 255, 255, 0.11);
        background: rgba(255, 255, 255, 0.04);
        color: #edf5ff;
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      #logoutBtn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      #authOverlay {
        position: fixed;
        inset: 0;
        z-index: 5000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(6, 9, 13, 0.88);
        backdrop-filter: blur(2px);
      }

      #authOverlay[hidden] {
        display: none;
      }

      #authCard {
        width: 320px;
        max-width: calc(100vw - 32px);
        padding: 26px 24px 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: #111820;
        color: #edf5ff;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }

      #authCard h2 {
        margin: 0 0 16px;
        font-size: 21px;
      }

      #authForm {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: #98a9b9;
      }

      .auth-field input {
        height: 38px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: #151515;
        color: #edf5ff;
        font: inherit;
        font-size: 14px;
      }

      .auth-error {
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 115, 102, 0.12);
        border: 1px solid rgba(255, 115, 102, 0.35);
        color: #ff9b91;
        font-size: 12px;
      }

      .auth-error[hidden] {
        display: none;
      }

      #authSubmitBtn {
        height: 40px;
        margin-top: 4px;
        border: 0;
        border-radius: 8px;
        background: #ff9400;
        color: #16110a;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      #authSubmitBtn:hover {
        background: #ffab33;
      }

      #authToggleModeBtn {
        width: 100%;
        margin-top: 12px;
        padding: 8px 0 0;
        border: 0;
        background: transparent;
        color: #7fc4ff;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        text-align: center;
      }

      #authToggleModeBtn:hover {
        text-decoration: underline;
      }

      .auth-note {
        margin: 14px 0 0;
        color: #6d7d8c;
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
      }

      #authCloseBtn {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #98a9b9;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      #authCloseBtn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #edf5ff;
      }

      #googleAuthBtn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        height: 40px;
        margin-top: 2px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: #ffffff;
        color: #1f1f1f;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      #googleAuthBtn:hover {
        background: #f1f1f1;
      }

      #googleAuthBtn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      #googleAuthBtn svg {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }

      .auth-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
        color: #6d7d8c;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .auth-divider::before,
      .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }

      /* ---- Role-based visibility ----
         Guests (not logged in) never see the draw tools or the layer
         on/off toggles at all. Logged-in non-admins see both, but not
         admin-only controls (the flag tool and the per-layer color
         pickers) — those need body.is-admin. */
      body:not(.logged-in) #drawToolsBtn,
      body:not(.logged-in) #toolMenu,
      body:not(.logged-in) .layer-actions {
        display: none !important;
      }

      body:not(.is-admin) .admin-only {
        display: none !important;
      }

      #openAuthBtn {
        border: 1px solid rgba(127, 196, 255, 0.4);
        background: rgba(127, 196, 255, 0.12);
        color: #7fc4ff;
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      #openAuthBtn:hover {
        background: rgba(127, 196, 255, 0.2);
      }

      #accountBar {
        flex-wrap: wrap;
      }

      #accountStatus {
        flex: 1;
        min-width: 0;
      }

      .role-badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        vertical-align: 1px;
      }

      .role-badge.admin {
        background: rgba(255, 148, 0, 0.18);
        color: #ff9400;
        border: 1px solid rgba(255, 148, 0, 0.4);
      }

      .role-badge.user {
        background: rgba(127, 196, 255, 0.14);
        color: #7fc4ff;
        border: 1px solid rgba(127, 196, 255, 0.35);
      }

      .layer-color-input {
        width: 26px;
        height: 26px;
        padding: 1px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
      }

      .flag-marker {
        cursor: grab;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6));
        transform-origin: bottom left;
      }

      .flag-marker img {
        display: block;
        width: 32px;
        height: auto;
        border-radius: 2px;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      .flag-marker:active {
        cursor: grabbing;
      }

      .tool-symbol img {
        display: block;
        width: 18px;
        height: auto;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside id="sidebar">
      <header id="sidebar-header">
        <div>
          <div class="eyebrow">Legend</div>
          <h1>Russo-Ukrainian War</h1>
        </div>
        <button id="drawToolsBtn" type="button" aria-label="Open drawing tools" aria-expanded="false" aria-controls="toolMenu"><span aria-hidden="true">✎</span>Draw</button>
        <div id="toolMenu" hidden>
          <button class="tool-option" type="button" data-tool="brush" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">〰</span>Brush</button>
          <button class="tool-option" type="button" data-tool="line" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">／</span>Line</button>
          <button class="tool-option" type="button" data-tool="pinpoint" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">⌖</span>Pinpoint</button>
          <button class="tool-option admin-only" type="button" data-tool="flag" data-flag-nation="ukraine" aria-pressed="false"><span class="tool-symbol" aria-hidden="true"><img src="https://flagcdn.com/w20/ua.png" alt="" /></span>Flag: Ukraine</button>
          <button class="tool-option admin-only" type="button" data-tool="flag" data-flag-nation="russia" aria-pressed="false"><span class="tool-symbol" aria-hidden="true"><img src="https://flagcdn.com/w20/ru.png" alt="" /></span>Flag: Russia</button>
          <div class="tool-divider"></div>
          <label class="color-option" for="drawColor">Drawing color<input id="drawColor" type="color" value="#FF9400" /></label>
          <div id="drawHint" aria-live="polite">Choose a tool to start drawing.</div>
          <div class="tool-divider"></div>
          <button id="clearDrawingsBtn" class="clear-drawings" type="button" disabled><span class="tool-symbol" aria-hidden="true">×</span>Clear all drawings</button>
        </div>
      </header>
      <div id="accountBar">
        <span id="accountStatus">Browsing as guest</span>
        <button id="openAuthBtn" type="button">Log in</button>
        <button id="logoutBtn" type="button" hidden>Log out</button>
      </div>

        <button type="button" id="googleAuthBtn">
          <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          Continue with Google

            <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required />
          </label>
          <div id="authError" class="auth-error" hidden></div>
          <button type="submit" id="authSubmitBtn">Log in</button>
        </form>

        <p class="auth-note">Real accounts via Firebase Authentication. Passwords must be at least 6 characters.</p>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.js"></script>
    <script>
      // ---- Register / log in (Firebase Authentication) ----
      // Real accounts, held by Firebase — not this browser.
      const firebaseConfig = {
        apiKey: 'AIzaSyBfb7AK_uGlVoLhgIOWlzjFswNCs0MO5_I',
        authDomain: 'register-82697.firebaseapp.com',
        projectId: 'register-82697',
        storageBucket: 'register-82697.firebasestorage.app',
        messagingSenderId: '517884260174',
        appId: '1:517884260174:web:b254ab7f4915d10853b81f'
      };
      let auth = null;
      let db = null;
      if (typeof firebase !== 'undefined') {
        try {
          firebase.initializeApp(firebaseConfig);
          auth = firebase.auth();
          db = firebase.firestore();
        } catch (error) {
          console.error('Firebase init failed', error);
        }
      }

      // Shared layer colors live in this one Firestore document so every
      // visitor's browser sees the same colors — not just the admin who
      // set them. Requires Cloud Firestore to be enabled on the Firebase
      // project (Build → Firestore Database → Create database) and a
      // rule allowing public read / admin-only write — see the rules
      // block noted alongside ADMIN_EMAILS below.
      const layerColorsDocRef = db ? db.collection('mapState').doc('layerColors') : null;

      const authOverlay = document.getElementById('authOverlay');
      const authCard = document.getElementById('authCard');
      const authCloseBtn = document.getElementById('authCloseBtn');
      const googleAuthBtn = document.getElementById('googleAuthBtn');
      const authTitle = document.getElementById('authTitle');
      const authForm = document.getElementById('authForm');
      const authUsername = document.getElementById('authUsername');
      const authPassword = document.getElementById('authPassword');
      const authError = document.getElementById('authError');
      const authSubmitBtn = document.getElementById('authSubmitBtn');
      const authToggleModeBtn = document.getElementById('authToggleModeBtn');
      const accountStatus = document.getElementById('accountStatus');
      const openAuthBtn = document.getElementById('openAuthBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      // ---- Roles ----
      // Anyone can browse the map without an account. Logging in (any
      // account) unlocks the draw tools and the layer on/off toggles.
      // An email listed here additionally gets admin-only controls: the
      // flag tool (place + drag flags) and per-layer polygon color
      // pickers. Edit this list to set who's an admin — it's a simple
      // client-side check, not a real access-control boundary, so don't
      // rely on it to keep out a determined visitor with dev tools.
      const ADMIN_EMAILS = ['berlininanutshell@gmail.com'];

      function currentRole() {
        if (!auth || !auth.currentUser) {
          return 'guest';
        }
        const email = (auth.currentUser.email || '').toLowerCase();
        return ADMIN_EMAILS.includes(email) ? 'admin' : 'user';
      }

      // Applies the current role to the page: shows/hides the draw
      // tools, layer toggles and admin-only controls, and updates the
      // account bar. Called on every auth-state change.
      function applyRole() {
        const role = currentRole();
        state.role = role;

        document.body.classList.toggle('logged-in', role !== 'guest');
        document.body.classList.toggle('is-admin', role === 'admin');

        if (role === 'guest') {
          accountStatus.textContent = 'Browsing as guest';
          openAuthBtn.hidden = false;
          logoutBtn.hidden = true;
          // Guests can't draw or toggle layers — make sure nothing is
          // left armed/open from a previous session.
          closeToolMenu();
        } else {
          const email = auth.currentUser.email || '';
          accountStatus.innerHTML =
            'Signed in as <strong>' + escapeHtml(email) + '</strong>' +
            '<span class="role-badge ' + role + '">' + role + '</span>';
          openAuthBtn.hidden = true;
          logoutBtn.hidden = false;
        }

        // Non-admins can't have the flag tool armed, and the layer list
        // needs to add/remove its admin-only color pickers.
        if (role !== 'admin' && state.drawingTool === 'flag') {
          deactivateDrawingTool();
        }
        renderLayers();
      }

      let authMode = 'login';

      function setAuthMode(mode) {
        authMode = mode;
        authError.hidden = true;
        authForm.reset();
        if (mode === 'register') {
          authTitle.textContent = 'Register';
          authSubmitBtn.textContent = 'Create account';
          authToggleModeBtn.textContent = 'Already have an account? Log in';
        } else {
          authTitle.textContent = 'Log in';
          authSubmitBtn.textContent = 'Log in';
          authToggleModeBtn.textContent = 'Need an account? Register';
        }
        authUsername.focus();
      }

      function showAuthError(message) {
        authError.textContent = message;
        authError.hidden = false;
      }

      function showAuthOverlay() {
        authOverlay.hidden = false;
        setAuthMode('login');
      }

      function hideAuthOverlay() {
        authOverlay.hidden = true;
      }

      // Firebase's own errors are already reasonably readable
      // (e.g. "The email address is already in use by another
      // account."), so most just get passed straight through.
      function describeAuthError(error) {
        if (error.code === 'auth/invalid-email') {
          return 'Enter a valid email address.';
        }
        if (error.code === 'auth/weak-password') {
          return 'Password must be at least 6 characters.';
        }
        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          return 'Incorrect email or password.';
        }
        if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
          return '';
        }
        if (error.code === 'auth/account-exists-with-different-credential') {
          return 'That email is already registered with a password — log in with your password instead.';
        }
        return error.message;
      }

      if (auth) {
        const googleProvider = typeof firebase !== 'undefined' ? new firebase.auth.GoogleAuthProvider() : null;

        openAuthBtn.addEventListener('click', () => {
          showAuthOverlay();
        });

        authCloseBtn.addEventListener('click', () => {
          hideAuthOverlay();
        });

        if (googleProvider) {
          googleAuthBtn.addEventListener('click', async () => {
            googleAuthBtn.disabled = true;
            try {
              await auth.signInWithPopup(googleProvider);
              // onAuthStateChanged (below) handles hiding the overlay.
            } catch (error) {
              const message = describeAuthError(error);
              if (message) {
                showAuthError(message);
              }
            } finally {
              googleAuthBtn.disabled = false;
            }
          });
        } else {
          googleAuthBtn.hidden = true;
        }

        // Clicking the dimmed backdrop dismisses it too, same as the ×
        // — login is optional now, so nothing should trap the visitor.
        authOverlay.addEventListener('click', (event) => {
          if (event.target === authOverlay) {
            hideAuthOverlay();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !authOverlay.hidden) {
            hideAuthOverlay();
          }
        });

        authToggleModeBtn.addEventListener('click', () => {
          setAuthMode(authMode === 'login' ? 'register' : 'login');
        });

        authForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const email = authUsername.value.trim();
          const password = authPassword.value;

          if (!email || !password) {
            showAuthError('Enter an email and password.');
            return;
          }

          authSubmitBtn.disabled = true;
          try {
            if (authMode === 'register') {
              await auth.createUserWithEmailAndPassword(email, password);
            } else {
              await auth.signInWithEmailAndPassword(email, password);
            }
            // onAuthStateChanged (below) handles hiding the overlay.
          } catch (error) {
            showAuthError(describeAuthError(error));
          } finally {
            authSubmitBtn.disabled = false;
          }
        });

        logoutBtn.addEventListener('click', () => {
          auth.signOut();
        });

        auth.onAuthStateChanged((user) => {
          if (user) {
            hideAuthOverlay();
          }
          applyRole();
        });
      } else {
        // Firebase didn't load (SDK blocked, offline, or the config
        // above is still the placeholder) — the map stays fully usable
        // as a guest; logging in just won't be available.
        console.warn('Firebase Authentication unavailable — continuing as guest only.');
        openAuthBtn.hidden = true;
      }

      const mapStyles = {
        dark: {
          name: 'Dark Matter',
          url: 'https://api.maptiler.com/maps/dataviz-v4-dark/style.json?key=okpdMcXQXKD9GKjumNOC'
        },
        streets: {
          name: 'Streets',
          url: 'https://api.maptiler.com/maps/streets-v2/style.json?key=okpdMcXQXKD9GKjumNOC'
        },
        hybrid: {
          name: 'Satellite Hybrid',
          url: 'https://api.maptiler.com/maps/hybrid/style.json?key=okpdMcXQXKD9GKjumNOC'
        },
        terrain: {
          name: 'Mapzen Terrain',
          style: {
            version: 8,
            sources: {},
            layers: [{
              id: 'terrain-background',
              type: 'background',
                paint: { 'background-color': '#0b0f14' }
            }]
          }
        },
        darkmatteralt: {
          name: 'Dark Matter (OpenMapTiles)',
          url: 'https://openmaptiles.github.io/dark-matter-gl-style/style-cdn.json'
        }
      };

      const state = {
        layers: [
          { id: 'main', name: 'Main Layer', visible: true, color: '#ff0000' },
          { id: 'russian-advances', name: 'Russian advances', visible: true, color: '#FF9400' },
          { id: 'ukrainian-advances', name: 'Ukrainian advances', visible: true, color: '#0000ff' }
        ],
        currentStyle: 'Dark Matter',
        currentStyleValue: 'dark',
        drawingColor: '#FF9400',
        drawingTool: null,
        drawings: [],
        draft: null,
        isBrushing: false,
        role: 'guest',
        flagType: 'ukraine'
      };

      // Flags are plain maplibregl.Markers (not GeoJSON features like the
      // other drawings) so admins can drag them around freely. Kept in
      // their own array purely so "Clear all drawings" doesn't have to
      // guess which markers on the map are flags.
      let flagMarkers = [];

      const layersList = document.getElementById('layersList');
      const drawToolsBtn = document.getElementById('drawToolsBtn');
      const toolMenu = document.getElementById('toolMenu');
      const drawColor = document.getElementById('drawColor');
      const drawHint = document.getElementById('drawHint');
      const clearDrawingsBtn = document.getElementById('clearDrawingsBtn');
      const mapSummary = document.getElementById('mapSummary');
      const mapStyleSelect = document.getElementById('mapStyleSelect');

      const coordinatePopup = document.getElementById('coordinatePopup');
      const coordinateText = document.getElementById('coordinateText');
      const closeCoordinatesBtn = document.getElementById('closeCoordinatesBtn');
      const copyCoordinatesBtn = document.getElementById('copyCoordinatesBtn');
      const addPinpointBtn = document.getElementById('addPinpointBtn');
      let currentCoordinates = '';
      let currentCoordinateLatLng = null;
      let coordinatePopupHideTimeout = null;

      const searchInput = document.getElementById('searchInput');
      const searchResults = document.getElementById('searchResults');
      let searchMarker = null;

      coordinatePopup.addEventListener('click', (event) => {
        event.stopPropagation();
      });

      closeCoordinatesBtn.addEventListener('click', () => {
        closeCoordinatePopup();
      });

      mapStyleSelect.addEventListener('change', closeCoordinatePopup, true);

      // ---- Drawing tool activation / deactivation ----
      // The map only responds to draw gestures while a tool is armed
      // (state.drawingTool !== null). Closing the tool menu, in any way,
      // disarms the current tool so clicks/drags on the map behave like
      // normal panning again until the user reopens the menu and picks
      // a tool explicitly.
      function deactivateDrawingTool() {
        state.drawingTool = null;
        document.querySelectorAll('.tool-option').forEach((option) => {
          option.setAttribute('aria-pressed', 'false');
        });
        drawHint.textContent = 'Choose a tool to start drawing.';
        map.getCanvasContainer().style.cursor = '';

        // Discard any in-progress drawing (e.g. a line waiting for its
        // second click, or an active brush stroke) so nothing is left
        // half-drawn once the tool is disarmed.
        state.isBrushing = false;
        state.draft = null;
        map.dragPan.enable();
        updateDrawings();
      }

      function closeToolMenu() {
        if (toolMenu.hidden) {
          return;
        }
        toolMenu.hidden = true;
        drawToolsBtn.setAttribute('aria-expanded', 'false');
        deactivateDrawingTool();
      }

      function renderLayers() {
        const visibleCount = state.layers.filter((layer) => layer.visible).length;
        mapSummary.textContent = state.currentStyle + ' • ' + visibleCount + ' visible layer' + (visibleCount === 1 ? '' : 's');

        layersList.innerHTML = '';

        state.layers.forEach((layer) => {
          const item = document.createElement('div');
          item.className = 'layer-item' + (layer.visible ? '' : ' hidden');

          const dot = document.createElement('span');
          dot.className = 'layer-dot';
          dot.style.background = layer.color;

          const name = document.createElement('div');
          name.className = 'layer-name';
          name.textContent = layer.name;

          const actions = document.createElement('div');
          actions.className = 'layer-actions';

          // Admin-only: recolor this layer's polygons/lines/points
          // directly on the map.
          const colorInput = document.createElement('input');
          colorInput.type = 'color';
          colorInput.className = 'layer-color-input admin-only';
          colorInput.value = layer.color;
          colorInput.setAttribute('aria-label', 'Change ' + layer.name + ' color');
          colorInput.addEventListener('input', () => {
            layer.color = colorInput.value;
            dot.style.background = colorInput.value;
            ensureKmlLayersForLayer(layer.id);

            // Push the change to Firestore so every other visitor's
            // browser picks it up too (see the onSnapshot listener
            // below) — not just this admin's own tab.
            if (layerColorsDocRef) {
              layerColorsDocRef
                .set({ colors: { [layer.id]: colorInput.value } }, { merge: true })
                .catch((error) => {
                  console.error('Failed to save shared layer color', error);
                });
            }
          });

          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'toggle-btn';
          toggle.textContent = layer.visible ? 'On' : 'Off';
          toggle.addEventListener('click', () => {
            layer.visible = !layer.visible;
            renderLayers();
            ensureKmlLayersForLayer(layer.id);
          });

          actions.appendChild(colorInput);
          actions.appendChild(toggle);

          item.appendChild(dot);
          item.appendChild(name);
          item.appendChild(actions);
          layersList.appendChild(item);
        });
      }

      // Keeps every visitor's layer colors in sync with whatever the
      // admin last set, in real time — including on first page load, so
      // a fresh guest sees the admin's colors, not the hardcoded
      // defaults in state.layers above.
      if (layerColorsDocRef) {
        layerColorsDocRef.onSnapshot((doc) => {
          if (!doc.exists) {
            return;
          }
          const colors = doc.data().colors || {};
          let changed = false;
          state.layers.forEach((layer) => {
            const sharedColor = colors[layer.id];
            if (sharedColor && sharedColor !== layer.color) {
              layer.color = sharedColor;
              changed = true;
              if (map.isStyleLoaded()) {
                ensureKmlLayersForLayer(layer.id);
              }
            }
          });
          if (changed) {
            renderLayers();
          }
        }, (error) => {
          console.error('Failed to sync shared layer colors', error);
        });
      }

      drawToolsBtn.addEventListener('click', () => {
        const isOpen = !toolMenu.hidden;
        if (isOpen) {
          closeToolMenu();
        } else {
          toolMenu.hidden = false;
          drawToolsBtn.setAttribute('aria-expanded', 'true');
        }
      });

      document.querySelectorAll('.tool-option').forEach((button) => {
        button.addEventListener('click', () => {
          // The flag tool is only ever meant to be reachable by admins —
          // it's hidden via CSS for everyone else, but this guard covers
          // it too in case the role changed after the menu was opened.
          if (button.dataset.tool === 'flag' && state.role !== 'admin') {
            return;
          }

          state.drawingTool = button.dataset.tool;
          if (button.dataset.tool === 'flag') {
            state.flagType = button.dataset.flagNation === 'russia' ? 'russia' : 'ukraine';
          }
          document.querySelectorAll('.tool-option').forEach((option) => {
            option.setAttribute('aria-pressed', String(option === button));
          });

          const hints = {
            brush: 'Drag on the map to draw a freehand stroke.',
            line: 'Click two points on the map to draw a line.',
            pinpoint: 'Click the map to place a pinpoint.',
            flag: 'Click the map to place a ' + (state.flagType === 'russia' ? 'Russian' : 'Ukrainian') + ' flag. Drag a flag to move it.'
          };
          drawHint.textContent = hints[state.drawingTool];
          map.getCanvasContainer().style.cursor = 'crosshair';
        });
      });

      drawColor.addEventListener('input', () => {
        state.drawingColor = drawColor.value;
      });

      const mapContainer = document.getElementById('map');

      document.addEventListener('click', (event) => {
        if (
          !toolMenu.hidden &&
          !toolMenu.contains(event.target) &&
          !drawToolsBtn.contains(event.target) &&
          !mapContainer.contains(event.target)
        ) {
          closeToolMenu();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !toolMenu.hidden) {
          closeToolMenu();
        }
      });

      clearDrawingsBtn.addEventListener('click', () => {
        state.drawings = [];
        state.draft = null;
        state.isBrushing = false;
        map.dragPan.enable();
        updateDrawings();
        if (state.role === 'admin') {
          flagMarkers.forEach((marker) => marker.remove());
          flagMarkers = [];
        }
      });

      mapStyleSelect.addEventListener('change', () => {
        const selectedValue = mapStyleSelect.value;
        const selectedStyle = mapStyles[selectedValue];
        closeCoordinatePopup();
        map.setStyle(selectedStyle.style || selectedStyle.url, { diff: false });

        state.currentStyle = selectedStyle.name;
        state.currentStyleValue = selectedValue;
        renderLayers();
        document.getElementById('error').style.display = 'none';
      });

      renderLayers();

      if (!window.WebGLRenderingContext) {
        const e = document.getElementById('error');
        e.textContent = 'WebGL is not available in this browser.';
        e.style.display = 'block';
        throw new Error('WebGL not supported');
      }

      const map = new maplibregl.Map({
        container: 'map',
        style: mapStyles.dark.url,
        center: [30.69368488654, 49.31602324674],
        zoom: 5.3,
        minZoom: 2,
        attributionControl: true,
        // Right-click drag is used only to show coordinates (see the
        // 'contextmenu' handler below), never to tilt/rotate the map.
        pitchWithRotate: false,
        dragRotate: false,
        touchPitch: false
      });

      // Belt-and-suspenders: some builds still wire up rotate/pitch via
      // touch gestures even with the constructor options above, so
      // explicitly disable them once the map instance exists too.
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();
      map.touchPitch.disable();

      // ---- KML layers ----
      // Each entry in state.layers can carry KML data of its own, kept
      // separate per layer id so toggling a layer's On/Off switch also
      // shows/hides only the KML shapes that belong to it. Files are
      // loaded from kml/<layerId>/<file>.kml on the same host as this
      // page, listed in kml/manifest.json — see the README in the kml
      // folder for how to add your own.
      const layerKmlData = {};

      function getLayerById(layerId) {
        return state.layers.find((layer) => layer.id === layerId);
      }

      function kmlGetText(node, tag) {
        const el = node.getElementsByTagName(tag)[0];
        return el ? el.textContent.trim() : '';
      }

      function kmlParseCoordinates(text) {
        return text
          .trim()
          .split(/\s+/)
          .map((triplet) => {
            const parts = triplet.split(',').map(Number);
            return parts.length >= 2 && !Number.isNaN(parts[0]) && !Number.isNaN(parts[1])
              ? [parts[0], parts[1]]
              : null;
          })
          .filter(Boolean);
      }

      // getElementsByTagName searches all descendants, so this also picks
      // up geometries nested inside a <MultiGeometry> without any extra
      // handling — each one just becomes its own GeoJSON feature.
      function kmlExtractGeometries(placemark) {
        const geometries = [];

        Array.from(placemark.getElementsByTagName('Point')).forEach((point) => {
          const coords = kmlParseCoordinates(kmlGetText(point, 'coordinates'))[0];
          if (coords) {
            geometries.push({ type: 'Point', coordinates: coords });
          }
        });

        Array.from(placemark.getElementsByTagName('LineString')).forEach((lineString) => {
          const coords = kmlParseCoordinates(kmlGetText(lineString, 'coordinates'));
          if (coords.length > 1) {
            geometries.push({ type: 'LineString', coordinates: coords });
          }
        });

        Array.from(placemark.getElementsByTagName('Polygon')).forEach((polygon) => {
          const outer = polygon.getElementsByTagName('outerBoundaryIs')[0];
          const outerRing = outer ? outer.getElementsByTagName('LinearRing')[0] : null;
          const outerCoords = outerRing ? kmlParseCoordinates(kmlGetText(outerRing, 'coordinates')) : [];
          if (outerCoords.length <= 2) {
            return;
          }

          const rings = [outerCoords];
          Array.from(polygon.getElementsByTagName('innerBoundaryIs')).forEach((inner) => {
            const innerRing = inner.getElementsByTagName('LinearRing')[0];
            const innerCoords = innerRing ? kmlParseCoordinates(kmlGetText(innerRing, 'coordinates')) : [];
            if (innerCoords.length > 2) {
              rings.push(innerCoords);
            }
          });
          geometries.push({ type: 'Polygon', coordinates: rings });
        });

        return geometries;
      }

      function parseKmlToGeoJSON(kmlString) {
        const dom = new DOMParser().parseFromString(kmlString, 'text/xml');
        if (dom.getElementsByTagName('parsererror').length > 0) {
          throw new Error('Could not parse KML file.');
        }

        const features = [];
        Array.from(dom.getElementsByTagName('Placemark')).forEach((placemark) => {
          const name = kmlGetText(placemark, 'name');
          const description = kmlGetText(placemark, 'description');
          kmlExtractGeometries(placemark).forEach((geometry) => {
            features.push({ type: 'Feature', properties: { name, description }, geometry });
          });
        });

        return { type: 'FeatureCollection', features };
      }

      // Adds (or updates) the geojson source + fill/line/point layers for
      // one layer's KML data, and syncs their visibility to that layer's
      // On/Off state. Safe to call repeatedly, including after a style
      // change wipes custom sources/layers (see 'style.load' below).
      function ensureKmlLayersForLayer(layerId) {
        const layer = getLayerById(layerId);
        // Note: no map.isStyleLoaded() guard here. This function is
        // called from the 'style.load' handler (right after a style
        // switch wipes custom sources/layers), where addSource/addLayer
        // are safe to call even though isStyleLoaded() can still
        // momentarily report false — that mismatch was causing KML
        // polygons to silently fail to re-appear after switching map
        // styles, until something else (like toggling a layer) called
        // this function again a bit later.
        if (!layer || !map.getStyle()) {
          return;
        }

        const sourceId = 'kml-' + layerId;
        const data = layerKmlData[layerId] || { type: 'FeatureCollection', features: [] };
        const visibility = layer.visible ? 'visible' : 'none';
        const color = layer.color;

        if (map.getSource(sourceId)) {
          map.getSource(sourceId).setData(data);
        } else {
          map.addSource(sourceId, { type: 'geojson', data });
        }

        const fillId = sourceId + '-fill';
        if (!map.getLayer(fillId)) {
          map.addLayer({
            id: fillId,
            type: 'fill',
            source: sourceId,
            filter: ['==', ['geometry-type'], 'Polygon'],
            layout: { visibility },
            paint: { 'fill-color': color, 'fill-opacity': 0.25, 'fill-outline-color': color }
          });
        } else {
          map.setLayoutProperty(fillId, 'visibility', visibility);
          map.setPaintProperty(fillId, 'fill-color', color);
          map.setPaintProperty(fillId, 'fill-outline-color', color);
        }

        const lineId = sourceId + '-line';
        if (!map.getLayer(lineId)) {
          map.addLayer({
            id: lineId,
            type: 'line',
            source: sourceId,
            filter: ['==', ['geometry-type'], 'LineString'],
            layout: { visibility, 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': color, 'line-width': 3 }
          });
        } else {
          map.setLayoutProperty(lineId, 'visibility', visibility);
          map.setPaintProperty(lineId, 'line-color', color);
        }

        const pointId = sourceId + '-point';
        if (!map.getLayer(pointId)) {
          map.addLayer({
            id: pointId,
            type: 'circle',
            source: sourceId,
            filter: ['==', ['geometry-type'], 'Point'],
            layout: { visibility },
            paint: {
              'circle-radius': 6,
              'circle-color': color,
              'circle-stroke-color': '#ffffff',
              'circle-stroke-width': 1.5
            }
          });
        } else {
          map.setLayoutProperty(pointId, 'visibility', visibility);
          map.setPaintProperty(pointId, 'circle-color', color);
        }
      }

      // Reads kml/manifest.json — an object like
      // { "main": ["occupation.kmz"], "russian-advances": ["push-1.kmz"] }
      // or a mixture of .kml and .kmz files.
      // — and loads every listed file from kml/<layerId>/<file>. Silently
      // does nothing if the manifest or a file isn't there (e.g. while
      // previewing this page without the kml/ folder alongside it).
      async function loadKml(url) {
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error(`Failed to load KML: ${response.status} ${response.statusText}`);
  }
  return await response.text();
}

      async function loadKmlManifestAndData() {
        let manifest;
        try {
          const manifestResponse = await fetch('kml/manifest.json');
          if (!manifestResponse.ok) {
            return;
          }
          manifest = await manifestResponse.json();
        } catch (error) {
          console.error('Failed to load kml/manifest.json', error);
          return;
        }

        for (const [layerId, fileNames] of Object.entries(manifest)) {
          const features = [];

          for (const fileName of fileNames) {
            try {
              const url = 'kml/' + layerId + '/' + fileName;
              const kmlText = await loadKml(url);
              features.push(...parseKmlToGeoJSON(kmlText).features);
            } catch (error) {
              console.error('Failed to load KML file', layerId, fileName, error);
            }
          }

          layerKmlData[layerId] = {
            type: 'FeatureCollection',
            features
          };

          ensureKmlLayersForLayer(layerId);
        }
      }

      map.on('load', loadKmlManifestAndData);

      // Hovering a KML polygon shows its name in a small floating label —
      // this never touches the polygon's paint properties, so its color
      // stays exactly as set (no hover-highlight color swap).
      const kmlHoverLabel = document.getElementById('kmlHoverLabel');

      function kmlFillLayerIds() {
        return state.layers
          .map((layer) => 'kml-' + layer.id + '-fill')
          .filter((id) => map.getLayer(id));
      }

      map.on('mousemove', (event) => {
        const fillLayerIds = kmlFillLayerIds();
        if (fillLayerIds.length === 0) {
          kmlHoverLabel.hidden = true;
          return;
        }

        const features = map.queryRenderedFeatures(event.point, { layers: fillLayerIds });
        const hovered = features[0];

        if (!hovered) {
          kmlHoverLabel.hidden = true;
          return;
        }

        // Prefer the KML placemark's own <name>, but most placemarks in
        // practice don't have one set — fall back to the sidebar layer's
        // name (e.g. "Russian advances") so hovering a polygon always
        // shows something instead of silently doing nothing.
        const placemarkName = hovered.properties && hovered.properties.name
          ? String(hovered.properties.name).trim()
          : '';
        const layerId = hovered.layer.id.replace(/^kml-/, '').replace(/-fill$/, '');
        const parentLayer = getLayerById(layerId);
        const label = placemarkName || (parentLayer ? parentLayer.name : '');

        if (!label) {
          kmlHoverLabel.hidden = true;
          return;
        }

        kmlHoverLabel.textContent = label;
        kmlHoverLabel.style.left = event.originalEvent.clientX + 14 + 'px';
        kmlHoverLabel.style.top = event.originalEvent.clientY + 14 + 'px';
        kmlHoverLabel.hidden = false;
      });

      map.on('mouseout', () => {
        kmlHoverLabel.hidden = true;
      });

      // ---- Search: jump the map to a typed place name or raw coordinates ----
      function parseCoordinateInput(text) {
        const match = text.trim().match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
        if (!match) {
          return null;
        }

        const first = parseFloat(match[1]);
        const second = parseFloat(match[2]);

        // Accept "lat, lng" (the normal order). If the first number can't be
        // a latitude but the second can, swap them so "lng, lat" still works.
        if (Math.abs(first) <= 90 && Math.abs(second) <= 180) {
          return { lat: first, lng: second };
        }
        if (Math.abs(second) <= 90 && Math.abs(first) <= 180) {
          return { lat: second, lng: first };
        }
        return null;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : text;
        return div.innerHTML;
      }

      function buildMarkerPopupHTML(lat, lng, cityName, countryName) {
        const coordsText = lat.toFixed(11) + ', ' + lng.toFixed(11);
        return (
          '<div class="marker-popup">' +
          '<div class="marker-popup-title">' + escapeHtml(cityName || 'Selected location') + '</div>' +
          (countryName ? '<div class="marker-popup-subtitle">' + escapeHtml(countryName) + '</div>' : '') +
          '<div class="marker-popup-coords">' + coordsText + '</div>' +
          '<button type="button" class="marker-popup-copy" data-coords="' + escapeHtml(coordsText) + '">Copy coordinates</button>' +
          '</div>'
        );
      }

      function attachMarkerPopup(marker, lat, lng, cityName, countryName) {
        const popup = new maplibregl.Popup({ offset: 28, closeButton: true, closeOnClick: false })
          .setHTML(buildMarkerPopupHTML(lat, lng, cityName, countryName));

        popup.on('open', () => {
          const container = popup.getElement();
          if (!container) {
            return;
          }

          const copyBtn = container.querySelector('.marker-popup-copy');
          if (copyBtn) {
            copyBtn.addEventListener('click', async () => {
              try {
                await navigator.clipboard.writeText(copyBtn.dataset.coords);
                copyBtn.textContent = 'Copied';
                setTimeout(() => {
                  copyBtn.textContent = 'Copy coordinates';
                }, 1500);
              } catch (error) {
                copyBtn.textContent = 'Copy unavailable';
              }
            });
          }

          // The × button removes the pinpoint itself, not just the popup.
          const closeBtn = container.querySelector('.maplibregl-popup-close-button');
          if (closeBtn) {
            closeBtn.addEventListener('click', () => {
              marker.remove();
              if (marker === searchMarker) {
                searchMarker = null;
              }
            });
          }
        });

        marker.setPopup(popup);
      }

      function flyToResult(lat, lng, zoom, cityName, countryName) {
        map.flyTo({
          center: [lng, lat],
          zoom: typeof zoom === 'number' ? zoom : Math.max(map.getZoom(), 10),
          essential: true
        });

        if (searchMarker) {
          searchMarker.remove();
        }
        searchMarker = new maplibregl.Marker({ color: '#ff9400' })
          .setLngLat([lng, lat])
          .addTo(map);
        attachMarkerPopup(searchMarker, lat, lng, cityName, countryName);
      }

      function closeSearchResults() {
        searchResults.hidden = true;
        searchResults.innerHTML = '';
      }

      function showSearchMessage(message) {
        searchResults.innerHTML = '';
        const item = document.createElement('div');
        item.className = 'search-result-message';
        item.textContent = message;
        searchResults.appendChild(item);
        searchResults.hidden = false;
      }

      function renderSearchResults(placeResults) {
        searchResults.innerHTML = '';
        placeResults.forEach((result) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'search-result-item';
          button.textContent = result.label;
          button.addEventListener('click', () => {
            flyToResult(result.lat, result.lng, result.zoom, result.city, result.country);
            searchInput.value = result.label;
            closeSearchResults();
          });
          searchResults.appendChild(button);
        });
        searchResults.hidden = placeResults.length === 0;
      }

      async function runSearch() {
        const query = searchInput.value.trim();
        if (!query) {
          closeSearchResults();
          return;
        }

        const coordinates = parseCoordinateInput(query);
        if (coordinates) {
          flyToResult(coordinates.lat, coordinates.lng, 12);
          closeSearchResults();
          return;
        }

        if (query.length < 2) {
          closeSearchResults();
          return;
        }

        showSearchMessage('Searching…');

        try {
          const url = 'https://api.maptiler.com/geocoding/' + encodeURIComponent(query) +
            '.json?key=okpdMcXQXKD9GKjumNOC&limit=5&autocomplete=true';
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error('Geocoding request failed');
          }

          const data = await response.json();

          // A later keystroke may have started a newer search already —
          // don't overwrite its (possibly still loading) results with a
          // stale response from this older request.
          if (searchInput.value.trim() !== query) {
            return;
          }

          const features = data.features || [];

          if (features.length === 0) {
            showSearchMessage('No results found.');
            return;
          }

          renderSearchResults(features.map((feature) => {
            const countryContext = (feature.context || []).find(
              (entry) => entry.id && entry.id.startsWith('country')
            );
            return {
              label: feature.place_name || feature.text,
              lat: feature.center[1],
              lng: feature.center[0],
              zoom: 11,
              city: feature.text,
              country: countryContext ? countryContext.text : ''
            };
          }));
        } catch (error) {
          console.error('search error', error);
          if (searchInput.value.trim() === query) {
            showSearchMessage('Search failed — check your connection and try again.');
          }
        }
      }

      let searchDebounceTimer = null;
      searchInput.addEventListener('input', () => {
        if (searchDebounceTimer) {
          clearTimeout(searchDebounceTimer);
        }
        searchDebounceTimer = setTimeout(runSearch, 300);
      });
      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          if (searchDebounceTimer) {
            clearTimeout(searchDebounceTimer);
          }
          runSearch();
        }
      });
      searchInput.addEventListener('focus', () => {
        if (searchResults.children.length > 0) {
          searchResults.hidden = false;
        }
      });

      document.addEventListener('click', (event) => {
        if (
          !searchResults.hidden &&
          !searchResults.contains(event.target) &&
          event.target !== searchInput
        ) {
          closeSearchResults();
        }
      });

      function closeCoordinatePopup() {
        if (coordinatePopupHideTimeout) {
          clearTimeout(coordinatePopupHideTimeout);
          coordinatePopupHideTimeout = null;
        }
        coordinatePopup.classList.remove('visible');
      }

      function showCoordinates(lat, lng, originalEvent) {
        currentCoordinates = lat.toFixed(11) + ', ' + lng.toFixed(11);
        currentCoordinateLatLng = { lat, lng };
        coordinateText.textContent = currentCoordinates;
        copyCoordinatesBtn.textContent = 'Copy coordinates';

        if (coordinatePopupHideTimeout) {
          clearTimeout(coordinatePopupHideTimeout);
          coordinatePopupHideTimeout = null;
        }

        // Position near the click, but keep the popup fully on-screen.
        const popupWidth = 260;
        const popupHeight = 130;
        let left = (originalEvent ? originalEvent.clientX : window.innerWidth / 2) + 12;
        let top = (originalEvent ? originalEvent.clientY : window.innerHeight / 2) + 12;
        left = Math.min(left, window.innerWidth - popupWidth - 12);
        top = Math.min(top, window.innerHeight - popupHeight - 12);

        coordinatePopup.style.left = Math.max(12, left) + 'px';
        coordinatePopup.style.top = Math.max(12, top) + 'px';

        // Fade in on the next frame so the transition actually runs.
        requestAnimationFrame(() => {
          coordinatePopup.classList.add('visible');
        });
      }

      function updateDrawings() {
        const features = state.drawings.slice();
        if (state.draft) {
          features.push(state.draft);
        }

        clearDrawingsBtn.disabled = features.length === 0;
        const source = map.getSource('user-drawings');
        if (source) {
          source.setData({ type: 'FeatureCollection', features });
        }
      }

      function makeLineFeature(coordinates, tool) {
        return {
          type: 'Feature',
          properties: { color: state.drawingColor, tool },
          geometry: { type: 'LineString', coordinates }
        };
      }

      // ---- Flags (admin only) ----
      // Flags are draggable maplibregl.Markers, not part of the
      // GeoJSON drawings source — dragging a marker is built in, so
      // there's nothing extra to wire up for "move flags" beyond
      // draggable: true. Only ever created from the map-click handler,
      // which already checks state.role === 'admin'.
      function placeFlag(lng, lat, flagType) {
        const nation = flagType === 'russia' ? 'russia' : 'ukraine';
        const code = nation === 'russia' ? 'ru' : 'ua';
        const label = nation === 'russia' ? 'Russia' : 'Ukraine';

        const el = document.createElement('div');
        el.className = 'flag-marker';
        el.innerHTML = '<img src="https://flagcdn.com/w40/' + code + '.png" alt="' + label + ' flag" draggable="false" />';

        const marker = new maplibregl.Marker({ element: el, draggable: true, anchor: 'bottom-left' })
          .setLngLat([lng, lat])
          .addTo(map);

        const popup = new maplibregl.Popup({ offset: 18, closeButton: true, closeOnClick: false })
          .setHTML(
            '<div class="marker-popup">' +
            '<div class="marker-popup-title">' + label + ' flag</div>' +
            '<div class="marker-popup-actions">' +
            '<button type="button" class="marker-popup-delete">Delete flag</button>' +
            '</div>' +
            '</div>'
          );

        popup.on('open', () => {
          const container = popup.getElement();
          const deleteBtn = container && container.querySelector('.marker-popup-delete');
          if (deleteBtn) {
            deleteBtn.addEventListener('click', () => {
              marker.remove();
              flagMarkers = flagMarkers.filter((m) => m !== marker);
            });
          }
        });

        marker.setPopup(popup);
        flagMarkers.push(marker);
        return marker;
      }

      map.on('contextmenu', (event) => {
        event.preventDefault();
        if (event.originalEvent) {
          event.originalEvent.preventDefault();
        }
        showCoordinates(event.lngLat.lat, event.lngLat.lng, event.originalEvent);
      });

      copyCoordinatesBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(currentCoordinates);
          copyCoordinatesBtn.textContent = 'Copied';
        } catch (error) {
          copyCoordinatesBtn.textContent = 'Copy unavailable';
        }
      });

      // A pinpoint added from the coordinates popup gets its own menu:
      // coordinates, a Copy button, the popup's own × (which only closes
      // the menu), and a separate Delete button that actually removes
      // the pinpoint.
      function attachCoordinatePinpointPopup(marker, lat, lng) {
        const coordsText = lat.toFixed(11) + ', ' + lng.toFixed(11);
        const html =
          '<div class="marker-popup">' +
          '<div class="marker-popup-title">Pinpoint</div>' +
          '<div class="marker-popup-coords">' + escapeHtml(coordsText) + '</div>' +
          '<div class="marker-popup-actions">' +
          '<button type="button" class="marker-popup-copy" data-coords="' + escapeHtml(coordsText) + '">Copy coordinates</button>' +
          '<button type="button" class="marker-popup-delete">Delete pinpoint</button>' +
          '</div>' +
          '</div>';

        const popup = new maplibregl.Popup({ offset: 28, closeButton: true, closeOnClick: false }).setHTML(html);

        popup.on('open', () => {
          const container = popup.getElement();
          if (!container) {
            return;
          }

          const copyBtn = container.querySelector('.marker-popup-copy');
          if (copyBtn) {
            copyBtn.addEventListener('click', async () => {
              try {
                await navigator.clipboard.writeText(copyBtn.dataset.coords);
                copyBtn.textContent = 'Copied';
                setTimeout(() => {
                  copyBtn.textContent = 'Copy coordinates';
                }, 1500);
              } catch (error) {
                copyBtn.textContent = 'Copy unavailable';
              }
            });
          }

          const deleteBtn = container.querySelector('.marker-popup-delete');
          if (deleteBtn) {
            deleteBtn.addEventListener('click', () => {
              marker.remove();
            });
          }
          // The built-in × close button is left as-is here (unlike the
          // search-result marker popup) — it only closes the menu, it
          // does not delete the pinpoint.
        });

        marker.setPopup(popup);
      }

      addPinpointBtn.addEventListener('click', () => {
        if (!currentCoordinateLatLng) {
          return;
        }

        const { lat, lng } = currentCoordinateLatLng;
        const marker = new maplibregl.Marker({ color: '#3fd0ff' }).setLngLat([lng, lat]).addTo(map);
        attachCoordinatePinpointPopup(marker, lat, lng);
        marker.togglePopup();
        closeCoordinatePopup();
      });

      map.on('mousedown', (event) => {
        if (state.drawingTool !== 'brush') {
          return;
        }

        event.preventDefault();
        state.isBrushing = true;
        state.draft = makeLineFeature([[event.lngLat.lng, event.lngLat.lat]], 'brush');
        map.dragPan.disable();
        updateDrawings();
      });

      map.on('mousemove', (event) => {
        if (state.isBrushing && state.draft) {
          state.draft.geometry.coordinates.push([event.lngLat.lng, event.lngLat.lat]);
          updateDrawings();
          return;
        }

        if (state.drawingTool === 'line' && state.draft) {
          state.draft.geometry.coordinates[1] = [event.lngLat.lng, event.lngLat.lat];
          updateDrawings();
        }
      });

      map.on('mouseup', () => {
        if (!state.isBrushing) {
          return;
        }

        state.isBrushing = false;
        map.dragPan.enable();
        if (state.draft && state.draft.geometry.coordinates.length > 1) {
          state.drawings.push(state.draft);
        }
        state.draft = null;
        updateDrawings();
      });

      map.on('click', (event) => {
        if (!state.drawingTool || state.drawingTool === 'brush' || state.isBrushing) {
          return;
        }

        event.preventDefault();
        const coordinate = [event.lngLat.lng, event.lngLat.lat];
        if (state.drawingTool === 'pinpoint') {
          state.drawings.push({
            type: 'Feature',
            properties: { color: state.drawingColor },
            geometry: { type: 'Point', coordinates: coordinate }
          });
          updateDrawings();
          return;
        }

        if (state.drawingTool === 'flag') {
          if (state.role !== 'admin') {
            return;
          }
          placeFlag(event.lngLat.lng, event.lngLat.lat, state.flagType);
          return;
        }

        if (!state.draft) {
          state.draft = makeLineFeature([coordinate, coordinate], 'line');
        } else {
          state.draft.geometry.coordinates[1] = coordinate;
          state.drawings.push(state.draft);
          state.draft = null;
        }
        updateDrawings();
      });

      map.on('style.load', () => {
        const styleLayers = map.getStyle().layers || [];

        if (mapStyleSelect.value === 'terrain') {
          map.addSource('mapzen-global-terrain', {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            tileSize: 256,
            maxzoom: 15,
            encoding: 'terrarium',
            attribution: 'Elevation data © Mapzen, hosted by AWS'
          });

          const builtInHillshade = styleLayers.find((layer) => layer.id === 'Hillshade');
          if (builtInHillshade) {
            map.setLayoutProperty(builtInHillshade.id, 'visibility', 'none');
          }

          const hillshadePosition = builtInHillshade?.id || styleLayers.find((layer) => layer.type !== 'background')?.id;
          map.addLayer({
            id: 'mapzen-global-terrain-hillshade',
            type: 'hillshade',
            source: 'mapzen-global-terrain',
            paint: {
              'hillshade-exaggeration': 0.85,
              'hillshade-illumination-direction': 315,
              'hillshade-illumination-anchor': 'viewport',
              'hillshade-shadow-color': '#07090c',
              'hillshade-highlight-color': '#68747e',
              'hillshade-accent-color': '#35414a'
            }
          }, hillshadePosition);
        }

        map.addSource('user-drawings', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });
        map.addLayer({
          id: 'user-drawing-lines',
          type: 'line',
          source: 'user-drawings',
          filter: ['==', ['geometry-type'], 'LineString'],
          layout: {
            'line-cap': 'round',
            'line-join': 'round'
          },
          paint: {
            'line-color': ['get', 'color'],
            'line-width': ['case', ['==', ['get', 'tool'], 'brush'], 5, 3]
          }
        });
        map.addLayer({
          id: 'user-drawing-points',
          type: 'circle',
          source: 'user-drawings',
          filter: ['==', ['geometry-type'], 'Point'],
          paint: {
            'circle-radius': 7,
            'circle-color': ['get', 'color'],
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 2
          }
        });
        updateDrawings();

        const safeSet = (layerId, prop, value) => {
          if (styleLayers.some((layer) => layer.id === layerId)) {
            map.setPaintProperty(layerId, prop, value);
          }
        };

        safeSet('background', 'background-color', '#0b0f14');
        safeSet('countries-fill', 'fill-color', '#171d25');
        safeSet('countries-boundary', 'line-color', '#394958');
        safeSet('countries-boundary', 'line-width', 1);
        safeSet('geolines', 'line-color', '#1d7bb8');
        safeSet('countries-label', 'text-color', '#dfe7ee');
        safeSet('countries-label', 'text-halo-color', '#0b0f14');

        // Changing the base style (via the dropdown) wipes every custom
        // source/layer, so re-create each layer's KML shapes from the
        // data already loaded in memory.
        state.layers.forEach((layer) => ensureKmlLayersForLayer(layer.id));
      });

      map.addControl(new maplibregl.NavigationControl({ showCompass: true }));
      map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-right');

      // The popup already fades out via its CSS transition (see
      // #coordinatePopup.visible) — closeCoordinatePopup() just removes
      // the class, so panning/zooming/rotating away from a pinned
      // coordinate dismisses it smoothly instead of leaving it stuck
      // over the wrong spot.
      map.on('movestart', closeCoordinatePopup);

      map.on('error', (err) => {
        console.error('map error', err);
        const e = document.getElementById('error');
        e.textContent = 'Map error: ' + (err && err.error ? err.error.message || err.error : err);
        e.style.display = 'block';
      });
    </script>
  </body>
</html>
