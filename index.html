<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Matter Map (public dark style)</title>
    <link href="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #0b0f14;
        overflow: hidden;
      }

      * {
        box-sizing: border-box;
      }

      #map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #coordinatePopup {
        position: fixed;
        z-index: 1000;
        min-width: 210px;
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        background: #ffffff;
        color: #111111;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        font-size: 13px;
      }

      #coordinatePopup[hidden] {
        display: none;
      }

      #coordinateHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 7px;
      }

      #coordinatePopup strong {
        display: block;
        font-size: 13px;
      }

      #closeCoordinatesBtn {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #111111;
        font: inherit;
        font-size: 19px;
        line-height: 1;
        cursor: pointer;
      }

      #closeCoordinatesBtn:hover {
        background: #eeeeee;
      }

      #coordinateText {
        margin-bottom: 10px;
        font-variant-numeric: tabular-nums;
        line-height: 1.5;
        white-space: pre-line;
      }

      #copyCoordinatesBtn {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid #c8c8c8;
        border-radius: 6px;
        background: #f5f5f5;
        color: #111111;
        font: inherit;
        cursor: pointer;
      }

      #copyCoordinatesBtn:hover {
        background: #e9e9e9;
      }

      #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 320px;
        z-index: 500;
        background: rgba(10, 10, 10, 0.96);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 18px 0 34px rgba(0, 0, 0, 0.25);
        color: #edf5ff;
        display: flex;
        flex-direction: column;
      }

      #sidebar-header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 18px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #98a9b9;
        margin-bottom: 4px;
      }

      #sidebar-header h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.1;
        font-weight: 700;
      }

      #drawToolsBtn {
        min-width: 82px;
        height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        background: rgba(255, 255, 255, 0.04);
        color: #f5f8ff;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      }

      #drawToolsBtn:hover,
      #drawToolsBtn[aria-expanded="true"] {
        background: rgba(255, 255, 255, 0.08);
      }

      #drawToolsBtn span {
        margin-right: 5px;
        font-size: 17px;
      }

      #toolMenu {
        position: absolute;
        top: calc(100% + 8px);
        right: 12px;
        z-index: 2;
        width: 220px;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: #111820;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      }

      #toolMenu[hidden] {
        display: none;
      }

      .tool-option {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #edf5ff;
        text-align: left;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .tool-option:hover,
      .tool-option[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.09);
      }

      .tool-symbol {
        width: 22px;
        color: #aebdca;
        text-align: center;
        font-size: 17px;
      }

      .tool-divider {
        height: 1px;
        margin: 6px 2px;
        background: rgba(255, 255, 255, 0.09);
      }

      .clear-drawings {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #ff9b91;
        text-align: left;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .clear-drawings:hover:not(:disabled) {
        background: rgba(255, 115, 102, 0.1);
      }

      .clear-drawings:disabled {
        opacity: 0.42;
        cursor: default;
      }

      .color-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        color: #d7e0e8;
        font-size: 13px;
      }

      #drawColor {
        width: 34px;
        height: 28px;
        padding: 2px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 7px;
        background: transparent;
        cursor: pointer;
      }

      #drawHint {
        min-height: 28px;
        padding: 5px 10px 2px;
        color: #94a5b4;
        font-size: 11px;
        line-height: 1.4;
      }

      #mapSummary {
        padding: 14px 18px 10px;
        color: #ccd6e1;
        font-size: 12px;
        opacity: 0.9;
      }

      #layersList {
        flex: 1;
        overflow-y: auto;
        padding: 6px 12px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #stylePicker {
        padding: 14px 18px 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      #stylePicker label {
        display: block;
        margin-bottom: 8px;
        color: #98a9b9;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #mapStyleSelect {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #151515;
        color: #edf5ff;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .layer-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .layer-item.hidden {
        opacity: 0.62;
      }

      .layer-item:hover {
        background: rgba(255, 255, 255, 0.045);
        border-color: rgba(255, 255, 255, 0.11);
      }

      .layer-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.28);
        flex-shrink: 0;
      }

      .layer-name {
        flex: 1;
        font-size: 15px;
        font-weight: 600;
      }

      .layer-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toggle-btn,
      .remove-btn {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: #edf5ff;
        border-radius: 8px;
        padding: 5px 8px;
        font-size: 11px;
        cursor: pointer;
      }

      .toggle-btn:hover,
      .remove-btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .remove-btn {
        padding: 5px 7px;
      }

      @media (max-width: 640px) {
        #sidebar {
          width: 70vw;
        }

        #sidebar-header h1 {
          font-size: 22px;
        }
      }

      #error {
        position: absolute;
        left: 12px;
        top: 12px;
        background: rgba(0,0,0,0.6);
        color: #fff;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 13px;
        display: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside id="sidebar">
      <header id="sidebar-header">
        <div>
          <div class="eyebrow">Legend</div>
          <h1>Russo-Ukrainian War</h1>
        </div>
        <button id="drawToolsBtn" type="button" aria-label="Open drawing tools" aria-expanded="false" aria-controls="toolMenu"><span aria-hidden="true">✎</span>Draw</button>
        <div id="toolMenu" hidden>
          <button class="tool-option" type="button" data-tool="brush" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">〰</span>Brush</button>
          <button class="tool-option" type="button" data-tool="line" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">／</span>Line</button>
          <button class="tool-option" type="button" data-tool="pinpoint" aria-pressed="false"><span class="tool-symbol" aria-hidden="true">⌖</span>Pinpoint</button>
          <div class="tool-divider"></div>
          <label class="color-option" for="drawColor">Drawing color<input id="drawColor" type="color" value="#FF9400" /></label>
          <div id="drawHint" aria-live="polite">Choose a tool to start drawing.</div>
          <div class="tool-divider"></div>
          <button id="clearDrawingsBtn" class="clear-drawings" type="button" disabled><span class="tool-symbol" aria-hidden="true">×</span>Clear all drawings</button>
        </div>
      </header>
      <div id="mapSummary">Dark theme • 3 visible layers</div>
      <div id="layersList" aria-live="polite"></div>
      <div id="stylePicker">
        <label for="mapStyleSelect">Map style</label>
        <select id="mapStyleSelect">
          <option value="dark">Dark Matter</option>
          <option value="streets">Streets (MapTiler)</option>
          <option value="hybrid">Satellite Hybrid</option>
          <option value="google-hybrid">Google Hybrid</option>
          <option value="terrain">Mapzen Global Terrain</option>
        </select>
      </div>
    </aside>
    <div id="coordinatePopup" role="status" aria-live="polite" hidden>
      <div id="coordinateHeader">
        <strong>Coordinates</strong>
        <button id="closeCoordinatesBtn" type="button" aria-label="Close coordinates">×</button>
      </div>
      <div id="coordinateText"></div>
      <button id="copyCoordinatesBtn" type="button">Copy coordinates</button>
    </div>
    <div id="error"></div>

    <script src="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.js"></script>
    <script>
      const googleMapsApiKey = 'AIzaSyBm4k8AaMjuAu4mXo4CJoNRPZpVR0ki5XA';
      const mapStyles = {
        dark: {
          name: 'Dark Matter',
          url: 'https://api.maptiler.com/maps/dataviz-v4-dark/style.json?key=okpdMcXQXKD9GKjumNOC'
        },
        streets: {
          name: 'Streets',
          url: 'https://api.maptiler.com/maps/streets-v2/style.json?key=okpdMcXQXKD9GKjumNOC'
        },
        hybrid: {
          name: 'Satellite Hybrid',
          url: 'https://api.maptiler.com/maps/hybrid/style.json?key=okpdMcXQXKD9GKjumNOC'
        },
        'google-hybrid': {
          name: 'Google Hybrid'
        },
        terrain: {
          name: 'Mapzen Terrain',
          style: {
            version: 8,
            sources: {},
            layers: [{
              id: 'terrain-background',
              type: 'background',
                paint: { 'background-color': '#0b0f14' }
            }]
          }
        }
      };

      const state = {
        layers: [
          { id: 'main', name: 'Main Layer', visible: true, color: '#ff0000' },
          { id: 'russian-advances', name: 'Russian advances', visible: true, color: '#FF9400' },
          { id: 'ukrainian-advances', name: 'Ukrainian advances', visible: true, color: '#0000ff' }
        ],
        currentStyle: 'Dark Matter',
        currentStyleValue: 'dark',
        googleSession: null,
        drawingColor: '#FF9400',
        drawingTool: null,
        drawings: [],
        draft: null,
        isBrushing: false
      };

      const layersList = document.getElementById('layersList');
      const drawToolsBtn = document.getElementById('drawToolsBtn');
      const toolMenu = document.getElementById('toolMenu');
      const drawColor = document.getElementById('drawColor');
      const drawHint = document.getElementById('drawHint');
      const clearDrawingsBtn = document.getElementById('clearDrawingsBtn');
      const mapSummary = document.getElementById('mapSummary');
      const mapStyleSelect = document.getElementById('mapStyleSelect');

      const googleCopyrightControl = {
        container: null,
        onAdd() {
          this.container = document.createElement('div');
          this.container.className = 'maplibregl-ctrl maplibregl-ctrl-attrib';
          this.container.style.display = 'none';
          this.container.setAttribute('aria-label', 'Google Maps data attribution');
          return this.container;
        },
        onRemove() {
          this.container.remove();
        },
        update(copyright) {
          if (!this.container) {
            return;
          }

          this.container.textContent = copyright || '';
          this.container.style.display = copyright ? 'block' : 'none';
        }
      };
      const coordinatePopup = document.getElementById('coordinatePopup');
      const coordinateText = document.getElementById('coordinateText');
      const closeCoordinatesBtn = document.getElementById('closeCoordinatesBtn');
      const copyCoordinatesBtn = document.getElementById('copyCoordinatesBtn');
      let currentCoordinates = '';

      coordinatePopup.addEventListener('click', (event) => {
        event.stopPropagation();
      });

      closeCoordinatesBtn.addEventListener('click', () => {
        coordinatePopup.hidden = true;
      });

      function renderLayers() {
        const visibleCount = state.layers.filter((layer) => layer.visible).length;
        mapSummary.textContent = state.currentStyle + ' • ' + visibleCount + ' visible layer' + (visibleCount === 1 ? '' : 's');

        layersList.innerHTML = '';

        state.layers.forEach((layer) => {
          const item = document.createElement('div');
          item.className = 'layer-item' + (layer.visible ? '' : ' hidden');

          const dot = document.createElement('span');
          dot.className = 'layer-dot';
          dot.style.background = layer.color;

          const name = document.createElement('div');
          name.className = 'layer-name';
          name.textContent = layer.name;

          const actions = document.createElement('div');
          actions.className = 'layer-actions';

          const toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'toggle-btn';
          toggle.textContent = layer.visible ? 'On' : 'Off';
          toggle.addEventListener('click', () => {
            layer.visible = !layer.visible;
            renderLayers();
          });

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'remove-btn';
          remove.textContent = '×';
          remove.title = 'Remove layer';
          remove.addEventListener('click', () => {
            if (state.layers.length <= 1) {
              return;
            }

            state.layers = state.layers.filter((entry) => entry.id !== layer.id);
            renderLayers();
          });

          actions.appendChild(toggle);
          actions.appendChild(remove);

          item.appendChild(dot);
          item.appendChild(name);
          item.appendChild(actions);
          layersList.appendChild(item);
        });
      }

      drawToolsBtn.addEventListener('click', () => {
        const isOpen = !toolMenu.hidden;
        toolMenu.hidden = isOpen;
        drawToolsBtn.setAttribute('aria-expanded', String(!isOpen));
      });

      document.querySelectorAll('.tool-option').forEach((button) => {
        button.addEventListener('click', () => {
          state.drawingTool = button.dataset.tool;
          document.querySelectorAll('.tool-option').forEach((option) => {
            option.setAttribute('aria-pressed', String(option === button));
          });

          const hints = {
            brush: 'Drag on the map to draw a freehand stroke.',
            line: 'Click two points on the map to draw a line.',
            pinpoint: 'Click the map to place a pinpoint.'
          };
          drawHint.textContent = hints[state.drawingTool];
          map.getCanvas().style.cursor = 'crosshair';
        });
      });

      drawColor.addEventListener('input', () => {
        state.drawingColor = drawColor.value;
      });

      document.addEventListener('click', (event) => {
        if (!toolMenu.hidden && !toolMenu.contains(event.target) && !drawToolsBtn.contains(event.target)) {
          toolMenu.hidden = true;
          drawToolsBtn.setAttribute('aria-expanded', 'false');
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !toolMenu.hidden) {
          toolMenu.hidden = true;
          drawToolsBtn.setAttribute('aria-expanded', 'false');
        }
      });

      clearDrawingsBtn.addEventListener('click', () => {
        state.drawings = [];
        state.draft = null;
        state.isBrushing = false;
        map.dragPan.enable();
        updateDrawings();
      });

      mapStyleSelect.addEventListener('change', async () => {
        const selectedValue = mapStyleSelect.value;
        const selectedStyle = mapStyles[selectedValue];
        let nextStyle = selectedStyle.style || selectedStyle.url;

        try {
          if (selectedValue === 'google-hybrid') {
            const response = await fetch('https://tile.googleapis.com/v1/createSession?key=' + encodeURIComponent(googleMapsApiKey), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                mapType: 'satellite',
                layerTypes: ['layerRoadmap'],
                overlay: false,
                language: 'en',
                region: 'UA'
              })
            });

            if (!response.ok) {
              throw new Error('Google Maps session request failed (' + response.status + '). Check that the Map Tiles API is enabled and the key is restricted correctly.');
            }

            const sessionData = await response.json();
            state.googleSession = sessionData.session;
            googleCopyrightControl.update('');
            nextStyle = {
              version: 8,
              sources: {
                googleHybrid: {
                  type: 'raster',
                  tiles: ['https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session=' + encodeURIComponent(state.googleSession) + '&key=' + encodeURIComponent(googleMapsApiKey)],
                  tileSize: sessionData.tileWidth || 256,
                  maxzoom: 22,
                  attribution: 'Google Maps'
                }
              },
              layers: [{ id: 'google-hybrid', type: 'raster', source: 'googleHybrid' }]
            };
          } else {
            state.googleSession = null;
            googleCopyrightControl.update('');
          }

          state.currentStyle = selectedStyle.name;
          state.currentStyleValue = selectedValue;
          renderLayers();
          map.setStyle(nextStyle, { diff: false });
          if (selectedValue === 'google-hybrid') {
            updateGoogleCopyright();
          }
          document.getElementById('error').style.display = 'none';
        } catch (error) {
          mapStyleSelect.value = state.currentStyleValue;
          state.currentStyle = mapStyles[state.currentStyleValue].name;
          renderLayers();
          const errorOverlay = document.getElementById('error');
          errorOverlay.textContent = error.message || String(error);
          errorOverlay.style.display = 'block';
        }
      });

      renderLayers();

      if (!window.WebGLRenderingContext) {
        const e = document.getElementById('error');
        e.textContent = 'WebGL is not available in this browser.';
        e.style.display = 'block';
        throw new Error('WebGL not supported');
      }

      const map = new maplibregl.Map({
        container: 'map',
        style: mapStyles.dark.url,
        center: [27.5, 48.4],
        zoom: 5.3,
        minZoom: 2,
        attributionControl: true,
      });

      map.addControl(googleCopyrightControl, 'bottom-right');

      async function updateGoogleCopyright() {
        if (!state.googleSession || mapStyleSelect.value !== 'google-hybrid') {
          return;
        }

        const bounds = map.getBounds();
        const params = new URLSearchParams({
          session: state.googleSession,
          key: googleMapsApiKey,
          zoom: String(Math.floor(map.getZoom())),
          north: String(bounds.getNorth()),
          south: String(bounds.getSouth()),
          east: String(bounds.getEast()),
          west: String(bounds.getWest())
        });

        try {
          const response = await fetch('https://tile.googleapis.com/tile/v1/viewport?' + params.toString());
          if (response.ok) {
            const viewportInfo = await response.json();
            googleCopyrightControl.update(viewportInfo.copyright);
          }
        } catch (error) {
          console.error('Google Maps attribution request failed', error);
        }
      }

      map.on('moveend', updateGoogleCopyright);

      map.on('movestart', () => {
        coordinatePopup.hidden = true;
      });

      function updateDrawings() {
        const features = state.drawings.slice();
        if (state.draft) {
          features.push(state.draft);
        }

        clearDrawingsBtn.disabled = features.length === 0;
        const source = map.getSource('user-drawings');
        if (source) {
          source.setData({ type: 'FeatureCollection', features });
        }
      }

      function makeLineFeature(coordinates, tool) {
        return {
          type: 'Feature',
          properties: { color: state.drawingColor, tool },
          geometry: { type: 'LineString', coordinates }
        };
      }

      map.on('contextmenu', (event) => {
        event.preventDefault();
        if (event.originalEvent) {
          event.originalEvent.preventDefault();
        }

        const longitude = event.lngLat.lng;
        const latitude = event.lngLat.lat;
        currentCoordinates = Number(latitude.toFixed(7)) + ', ' + Number(longitude.toFixed(7));
        coordinateText.textContent = currentCoordinates;
        copyCoordinatesBtn.textContent = 'Copy coordinates';

        const mouseEvent = event.originalEvent;
        const popupLeft = mouseEvent ? mouseEvent.clientX + 12 : event.point.x + 12;
        const popupTop = mouseEvent ? mouseEvent.clientY + 12 : event.point.y + 12;
        coordinatePopup.style.left = Math.max(8, Math.min(popupLeft, window.innerWidth - 230)) + 'px';
        coordinatePopup.style.top = Math.max(8, Math.min(popupTop, window.innerHeight - 120)) + 'px';
        coordinatePopup.hidden = false;
      });

      copyCoordinatesBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(currentCoordinates);
          copyCoordinatesBtn.textContent = 'Copied';
        } catch (error) {
          copyCoordinatesBtn.textContent = 'Copy unavailable';
        }
      });

      map.on('mousedown', (event) => {
        if (state.drawingTool !== 'brush') {
          return;
        }

        event.preventDefault();
        state.isBrushing = true;
        state.draft = makeLineFeature([[event.lngLat.lng, event.lngLat.lat]], 'brush');
        map.dragPan.disable();
        updateDrawings();
      });

      map.on('mousemove', (event) => {
        if (state.isBrushing && state.draft) {
          state.draft.geometry.coordinates.push([event.lngLat.lng, event.lngLat.lat]);
          updateDrawings();
          return;
        }

        if (state.drawingTool === 'line' && state.draft) {
          state.draft.geometry.coordinates[1] = [event.lngLat.lng, event.lngLat.lat];
          updateDrawings();
        }
      });

      map.on('mouseup', () => {
        if (!state.isBrushing) {
          return;
        }

        state.isBrushing = false;
        map.dragPan.enable();
        if (state.draft && state.draft.geometry.coordinates.length > 1) {
          state.drawings.push(state.draft);
        }
        state.draft = null;
        updateDrawings();
      });

      map.on('click', (event) => {
        if (!state.drawingTool || state.drawingTool === 'brush' || state.isBrushing) {
          return;
        }

        event.preventDefault();
        const coordinate = [event.lngLat.lng, event.lngLat.lat];
        if (state.drawingTool === 'pinpoint') {
          state.drawings.push({
            type: 'Feature',
            properties: { color: state.drawingColor },
            geometry: { type: 'Point', coordinates: coordinate }
          });
          updateDrawings();
          return;
        }

        if (!state.draft) {
          state.draft = makeLineFeature([coordinate, coordinate], 'line');
        } else {
          state.draft.geometry.coordinates[1] = coordinate;
          state.drawings.push(state.draft);
          state.draft = null;
        }
        updateDrawings();
      });

      map.on('style.load', () => {
        const styleLayers = map.getStyle().layers || [];

        if (mapStyleSelect.value === 'terrain') {
          map.addSource('mapzen-global-terrain', {
            type: 'raster-dem',
            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
            tileSize: 256,
            maxzoom: 15,
            encoding: 'terrarium',
            attribution: 'Elevation data © Mapzen, hosted by AWS'
          });

          const builtInHillshade = styleLayers.find((layer) => layer.id === 'Hillshade');
          if (builtInHillshade) {
            map.setLayoutProperty(builtInHillshade.id, 'visibility', 'none');
          }

          const hillshadePosition = builtInHillshade?.id || styleLayers.find((layer) => layer.type !== 'background')?.id;
          map.addLayer({
            id: 'mapzen-global-terrain-hillshade',
            type: 'hillshade',
            source: 'mapzen-global-terrain',
            paint: {
              'hillshade-exaggeration': 0.85,
              'hillshade-illumination-direction': 315,
              'hillshade-illumination-anchor': 'viewport',
              'hillshade-shadow-color': '#07090c',
              'hillshade-highlight-color': '#68747e',
              'hillshade-accent-color': '#35414a'
            }
          }, hillshadePosition);
        }

        map.addSource('user-drawings', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });
        map.addLayer({
          id: 'user-drawing-lines',
          type: 'line',
          source: 'user-drawings',
          filter: ['==', ['geometry-type'], 'LineString'],
          layout: {
            'line-cap': 'round',
            'line-join': 'round'
          },
          paint: {
            'line-color': ['get', 'color'],
            'line-width': ['case', ['==', ['get', 'tool'], 'brush'], 5, 3]
          }
        });
        map.addLayer({
          id: 'user-drawing-points',
          type: 'circle',
          source: 'user-drawings',
          filter: ['==', ['geometry-type'], 'Point'],
          paint: {
            'circle-radius': 7,
            'circle-color': ['get', 'color'],
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 2
          }
        });
        updateDrawings();

        const safeSet = (layerId, prop, value) => {
          if (styleLayers.some((layer) => layer.id === layerId)) {
            map.setPaintProperty(layerId, prop, value);
          }
        };

        safeSet('background', 'background-color', '#0b0f14');
        safeSet('countries-fill', 'fill-color', '#171d25');
        safeSet('countries-boundary', 'line-color', '#394958');
        safeSet('countries-boundary', 'line-width', 1);
        safeSet('geolines', 'line-color', '#1d7bb8');
        safeSet('countries-label', 'text-color', '#dfe7ee');
        safeSet('countries-label', 'text-halo-color', '#0b0f14');
      });

      map.addControl(new maplibregl.NavigationControl({ showCompass: true }));
      map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-right');

      map.on('error', (err) => {
        console.error('map error', err);
        const e = document.getElementById('error');
        e.textContent = 'Map error: ' + (err && err.error ? err.error.message || err.error : err);
        e.style.display = 'block';
      });
    </script>
  </body>
</html>
