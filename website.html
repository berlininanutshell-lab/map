<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Matter Map</title>
    <link
      href="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #101418;
      }

      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@3.0.1/dist/maplibre-gl.js"></script>
    <script>
      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://openmaptiles.github.io/dark-matter-gl-style/style-cdn.json',
        center: [-74.006, 40.7128],
        zoom: 11,
        minZoom: 2,
        attributionControl: true,
      });

      map.addControl(new maplibregl.NavigationControl({ showCompass: true }));
      map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }));
    </script>
  </body>
</html>
